# Put this file in the repository root. In Render: New > Blueprint > pick the repo.
services:
  - type: web
    name: efootball
    runtime: docker
    plan: free              # sleeps when idle; change to "starter" to keep it awake
    healthCheckPath: /api/tournaments/
    envVars:
      - key: SECRET_KEY
        generateValue: true               # Render invents a long random value
      - key: DATABASE_URL
        fromDatabase:
          name: efootball-db
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false                       # you type it in during setup
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: you@example.com            # change this
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false                       # you type it in during setup

databases:
  - name: efootball-db
    plan: free              # free databases expire; move to a paid plan to keep your data